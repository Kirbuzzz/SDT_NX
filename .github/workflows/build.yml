name: Build NRO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Asegurar libnx
        run: |
          if [ -d /opt/devkitpro/libnx ]; then
            echo "libnx ya esta en la imagen, no hace falta instalar nada"
          else
            if command -v dkp-pacman >/dev/null 2>&1; then PM=dkp-pacman; else PM=pacman; fi
            $PM -Sy --noconfirm switch-dev
          fi
      - name: Compilar
        run: make
      - name: Subir NRO
        uses: actions/upload-artifact@v4
        with:
          name: sdt_loader
          path: sdt_loader.nro
